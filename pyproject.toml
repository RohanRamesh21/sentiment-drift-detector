[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-drift-detector"
version = "0.1.0"
description = "Detect and explain temporal sentiment shifts from Reddit data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "praw>=7.8.1",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "python-dotenv>=1.0",
  "ruptures>=1.1.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
ml = ["transformers>=4.40", "torch>=2.2"]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: tests requiring external credentials/network access",
]
